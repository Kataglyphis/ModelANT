name: Linux x64 · mutation gates

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  mutations:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/mutation-gates.yml@develop
    with:
      manifest: scripts/tests/contract-mutations.json
      submodules: 'true'
      # Recipes import numpy and Pillow, which the image's Python has and the runner's lacks, as in check.yml.
      in-image: true
