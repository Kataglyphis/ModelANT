# A tag <name>-v<N> builds models/<name> from its pinned upstream in the family's Linux image and publishes it as that release.
name: Release a model

on:
  push:
    tags: ["*-v*"]
  # By hand: the same build, uploaded as an artifact instead of released.
  workflow_dispatch:
    inputs:
      model:
        description: "models/<name> to build without publishing"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    # About 10 min for the image pull, 5 for the build.
    timeout-minutes: 60
    steps:
      # No `image:` here or below: the actions default it from the hub's versions.env, its one owner.
      - name: Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          fetch-depth: '1'
          submodules: 'false'

      - name: Model name
        id: model
        env:
          MODEL: ${{ inputs.model }}
        run: echo "name=${MODEL:-${GITHUB_REF_NAME%-v*}}" >> "$GITHUB_OUTPUT"

      # The image's pinned CPython, torch and chain ONNX Runtime; build.sh refuses to run anywhere else.
      - name: Build the ONNX from the pinned upstream
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        env:
          MODEL_NAME: ${{ steps.model.outputs.name }}
        with:
          extra-args: -e MODEL_NAME
          script: bash -c 'bash scripts/build.sh "${MODEL_NAME}" dist'

      - name: Upload the build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.model.outputs.name }}
          path: dist/
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_NAME: ${{ steps.model.outputs.name }}
        run: |
          summary="$(jq -r .summary "models/${MODEL_NAME}/model.json")"
          {
            printf '%s\n\nLicense: Apache-2.0 (see %s.LICENSE and %s.NOTICE).\n\n' "${summary}" "${MODEL_NAME}" "${MODEL_NAME}"
            printf 'SHA-256:\n```\n'; cat dist/SHA256SUMS; printf '```\n'
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md
