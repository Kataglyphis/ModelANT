[project]
name = "modelant-export"
version = "0.0.0"
requires-python = ">=3.15"
dependencies = [
    "onnx==1.23.2",
    "onnx-ir==1.1.0",
    "faster-coco-eval==1.8.0",
    "tensorboard==2.21.0",
    "calflops==0.3.2",
    "transformers==5.20.2",
    "gdown==6.4.2",
    "certifi==2026.10.19",
    "filelock==4.1.1",
    "protobuf==6.33.6",
    "setuptools==84.0.0",
    "soupsieve==3.0.3",
    "sympy==1.14.0",
]

[tool.uv]
package = false
exclude-dependencies = ["torch", "torchvision", "onnxruntime", "numpy", "pillow", "pyyaml", "scipy"]
